name: Build Windows installer

on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]

permissions:
  contents: write        # needed to attach the installer to a GitHub Release

jobs:
  windows-installer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 nsis unzip curl python3-pip
      - name: Build installer
        run: bash tools/build_windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MoxyVPN-Setup
          path: dist/MoxyVPN-Setup.exe
      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MoxyVPN-Setup.exe
